# Builds the game and publishes it to GitHub Pages on every push to main.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Project sites live at https://<user>.github.io/<repo-name>/
          BASE_PATH: /${{ github.event.repository.name }}/
          # Optional TURN relay baked into the build (Settings -> Secrets and variables -> Actions -> Variables).
          VITE_TURN_URL: ${{ vars.TURN_URL }}
          VITE_TURN_USER: ${{ vars.TURN_USER }}
          VITE_TURN_PASS: ${{ vars.TURN_PASS }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
