<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ironclad Duo</title>
    <style>
      html, body { height: 100%; margin: 0; background: #14160f; color: #e8e4d4; font-family: 'Segoe UI', sans-serif; cursor: default; user-select: none; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
      img { width: 168px; height: 168px; }
      h1 { margin: 0; font: 900 34px Impact, 'Arial Black', sans-serif; letter-spacing: 5px; color: #d9a441; }
      #status { min-height: 22px; font-size: 16px; color: #b9b5a6; }
      #bar { position: relative; width: min(420px, 70vw); height: 8px; overflow: hidden; background: #2b2e22; border-radius: 4px; }
      #fill { position: absolute; top: 0; bottom: 0; left: 0; width: 30%; background: #d9a441; border-radius: 4px; }
      #fill.waiting { animation: sweep 1.2s ease-in-out infinite alternate; }
      @keyframes sweep { from { left: 0; } to { left: 70%; } }
    </style>
  </head>
  <body>
    <img src="icon.png" alt="" />
    <h1>IRONCLAD DUO</h1>
    <div id="status">Starting…</div>
    <div id="bar"><div id="fill" class="waiting"></div></div>
    <script>
      // The app calls this as it goes. No share of the work given: the bar just sweeps back and forth.
      function show(text, share = null) {
        document.getElementById('status').textContent = text;
        const fill = document.getElementById('fill');
        fill.classList.toggle('waiting', share === null);
        fill.style.width = share === null ? '30%' : `${Math.round(share * 100)}%`;
      }
    </script>
  </body>
</html>
